name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  frontend:
    name: Frontend — Build & Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Cài dependencies
        run: npm ci

      - name: TypeScript check
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Build production
        run: npm run build

  backend:
    name: Backend — Syntax & Import Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./pipeline
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cài dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Kiểm tra cú pháp Python
        run: |
          python -m py_compile main.py
          python -m py_compile users_admin.py
          python -m py_compile rate_limiter.py
          python -m py_compile auth_guard.py
          python -m py_compile classifier.py
          python -m py_compile clean.py
          python -m py_compile ingest.py
          python -m py_compile llm_agent.py
          python -m py_compile regions.py
          python -m py_compile rules.py
          python -m py_compile spike_detector.py
          python -m py_compile env_config.py

      - name: Kiểm tra import agents
        run: |
          python -m py_compile agents/orchestrator.py
          python -m py_compile agents/task_agent.py
          python -m py_compile agents/ticket_agent.py
