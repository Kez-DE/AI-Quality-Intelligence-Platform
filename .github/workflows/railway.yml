name: Deploy to Railway

on:
  push:
    branches:
      - main
    paths:
      - "app/**"
      - "pipeline/**"
      - "data/**"
      - ".env.example"
      - "railway.json"
      - ".github/workflows/railway.yml"
  workflow_dispatch:
    inputs:
      target:
        description: "Railway service to deploy"
        required: true
        default: "all"
        type: choice
        options:
          - all
          - frontend
          - backend
          - backend-worker
          - ingest-worker
          - ml-worker
          - agent-worker

concurrency:
  group: railway-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect changed services
    runs-on: self-hosted
    outputs:
      frontend: ${{ steps.detect.outputs.frontend }}
      backend: ${{ steps.detect.outputs.backend }}
      backend_worker: ${{ steps.detect.outputs.backend_worker }}
      ingest_worker: ${{ steps.detect.outputs.ingest_worker }}
      ml_worker: ${{ steps.detect.outputs.ml_worker }}
      agent_worker: ${{ steps.detect.outputs.agent_worker }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Detect service changes
        id: detect
        shell: bash
        run: |
          set -euo pipefail

          frontend=false
          backend=false
          backend_worker=false
          ingest_worker=false
          ml_worker=false
          agent_worker=false

          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            case "${{ inputs.target }}" in
              all)
                frontend=true
                backend=true
                backend_worker=true
                ingest_worker=true
                ml_worker=true
                agent_worker=true
                ;;
              frontend)
                frontend=true
                ;;
              backend)
                backend=true
                ;;
              backend-worker)
                backend_worker=true
                ;;
              ingest-worker)
                ingest_worker=true
                ;;
              ml-worker)
                ml_worker=true
                ;;
              agent-worker)
                agent_worker=true
                ;;
            esac
          else
            base="${{ github.event.before }}"
            if [[ -z "$base" || "$base" == "0000000000000000000000000000000000000000" ]]; then
              base="$(git rev-list --max-parents=0 HEAD)"
            fi

            changed_files="$(git diff --name-only "$base" "${{ github.sha }}")"
            echo "$changed_files"

            if echo "$changed_files" | grep -Eq '^(app/|railway\.json$|\.env\.example$|\.github/workflows/railway\.yml$)'; then
              frontend=true
            fi

            # Loại các file KHÔNG ảnh hưởng runtime của worker: test + script chạy
            # tay/offline (không được worker_*.py / main.py import). Sửa các file này
            # KHÔNG cần redeploy backend/worker -> tránh deploy toàn bộ vô ích.
            deploy_relevant="$(echo "$changed_files" | grep -vE '^pipeline/(tests/|eval/|scripts/|test_[^/]*\.py$|rescore_overall_risk\.py$|check_rag_data\.py$|seed_graph_kb\.py$)' || true)"
            echo "Deploy-relevant changes:"
            echo "$deploy_relevant"

            # Backend + all workers share the same source (pipeline/ + data/).
            if echo "$deploy_relevant" | grep -Eq '^(pipeline/|data/|railway\.json$|\.env\.example$|\.github/workflows/railway\.yml$)'; then
              backend=true
              backend_worker=true
              ingest_worker=true
              ml_worker=true
              agent_worker=true
            fi
          fi

          echo "frontend=$frontend" >> "$GITHUB_OUTPUT"
          echo "backend=$backend" >> "$GITHUB_OUTPUT"
          echo "backend_worker=$backend_worker" >> "$GITHUB_OUTPUT"
          echo "ingest_worker=$ingest_worker" >> "$GITHUB_OUTPUT"
          echo "ml_worker=$ml_worker" >> "$GITHUB_OUTPUT"
          echo "agent_worker=$agent_worker" >> "$GITHUB_OUTPUT"

  deploy-frontend:
    name: Deploy frontend
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: self-hosted
    timeout-minutes: 30
    env:
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
      RAILWAY_PROJECT_ID: ${{ secrets.RAILWAY_PROJECT_ID }}
      RAILWAY_ENVIRONMENT: ${{ vars.RAILWAY_ENVIRONMENT || 'production' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Railway CLI
        shell: bash
        run: |
          set -euo pipefail
          railway_cli_dir="$RUNNER_TEMP/railway-cli"
          mkdir -p "$railway_cli_dir"
          npm install --prefix "$railway_cli_dir" @railway/cli
          railway_bin="$railway_cli_dir/node_modules/.bin/railway"
          echo "$(dirname "$railway_bin")" >> "$GITHUB_PATH"
          echo "RAILWAY_CLI=$railway_bin" >> "$GITHUB_ENV"
          "$railway_bin" --version

      - name: Deploy frontend to Railway
        shell: bash
        run: '"$RAILWAY_CLI" up --ci --service frontend --environment "$RAILWAY_ENVIRONMENT" --project "$RAILWAY_PROJECT_ID"'

  deploy-backend:
    name: Deploy backend
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: self-hosted
    timeout-minutes: 30
    env:
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
      RAILWAY_PROJECT_ID: ${{ secrets.RAILWAY_PROJECT_ID }}
      RAILWAY_ENVIRONMENT: ${{ vars.RAILWAY_ENVIRONMENT || 'production' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Railway CLI
        shell: bash
        run: |
          set -euo pipefail
          railway_cli_dir="$RUNNER_TEMP/railway-cli"
          mkdir -p "$railway_cli_dir"
          npm install --prefix "$railway_cli_dir" @railway/cli
          railway_bin="$railway_cli_dir/node_modules/.bin/railway"
          echo "$(dirname "$railway_bin")" >> "$GITHUB_PATH"
          echo "RAILWAY_CLI=$railway_bin" >> "$GITHUB_ENV"
          "$railway_bin" --version

      - name: Deploy backend to Railway
        shell: bash
        run: '"$RAILWAY_CLI" up --ci --service backend --environment "$RAILWAY_ENVIRONMENT" --project "$RAILWAY_PROJECT_ID"'

  deploy-backend-worker:
    name: Deploy backend worker
    needs: changes
    if: needs.changes.outputs.backend_worker == 'true'
    runs-on: self-hosted
    timeout-minutes: 30
    env:
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
      RAILWAY_PROJECT_ID: ${{ secrets.RAILWAY_PROJECT_ID }}
      RAILWAY_ENVIRONMENT: ${{ vars.RAILWAY_ENVIRONMENT || 'production' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Railway CLI
        shell: bash
        run: |
          set -euo pipefail
          railway_cli_dir="$RUNNER_TEMP/railway-cli"
          mkdir -p "$railway_cli_dir"
          npm install --prefix "$railway_cli_dir" @railway/cli
          railway_bin="$railway_cli_dir/node_modules/.bin/railway"
          echo "$(dirname "$railway_bin")" >> "$GITHUB_PATH"
          echo "RAILWAY_CLI=$railway_bin" >> "$GITHUB_ENV"
          "$railway_bin" --version

      - name: Deploy backend worker to Railway
        shell: bash
        run: '"$RAILWAY_CLI" up --ci --service backend-worker --environment "$RAILWAY_ENVIRONMENT" --project "$RAILWAY_PROJECT_ID"'

  deploy-ingest-worker:
    name: Deploy ingest worker
    needs: changes
    if: needs.changes.outputs.ingest_worker == 'true'
    runs-on: self-hosted
    timeout-minutes: 30
    env:
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
      RAILWAY_PROJECT_ID: ${{ secrets.RAILWAY_PROJECT_ID }}
      RAILWAY_ENVIRONMENT: ${{ vars.RAILWAY_ENVIRONMENT || 'production' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Railway CLI
        shell: bash
        run: |
          set -euo pipefail
