name: Deploy to Railway

on:
  push:
    branches:
      - main
    paths:
      - "app/**"
      - "pipeline/**"
      - "data/**"
      - ".env.example"
      - "railway.json"
      - ".github/workflows/railway.yml"
  workflow_dispatch:
    inputs:
      target:
        description: "Railway service to deploy"
        required: true
        default: "all"
        type: choice
        options:
          - all
          - frontend
          - backend
          - backend-worker

concurrency:
  group: railway-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect changed services
    runs-on: self-hosted
    outputs:
      frontend: ${{ steps.detect.outputs.frontend }}
      backend: ${{ steps.detect.outputs.backend }}
      backend_worker: ${{ steps.detect.outputs.backend_worker }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Detect service changes
        id: detect
        shell: bash
        run: |
          set -euo pipefail

          frontend=false
          backend=false
          backend_worker=false

          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            case "${{ inputs.target }}" in
              all)
                frontend=true
                backend=true
                backend_worker=true
                ;;
              frontend)
                frontend=true
                ;;
              backend)
                backend=true
                ;;
              backend-worker)
                backend_worker=true
                ;;
            esac
          else
            base="${{ github.event.before }}"
            if [[ -z "$base" || "$base" == "0000000000000000000000000000000000000000" ]]; then
              base="$(git rev-list --max-parents=0 HEAD)"
            fi

            changed_files="$(git diff --name-only "$base" "${{ github.sha }}")"
            echo "$changed_files"

            if echo "$changed_files" | grep -Eq '^(app/|railway\.json$|\.env\.example$|\.github/workflows/railway\.yml$)'; then
              frontend=true
            fi

            if echo "$changed_files" | grep -Eq '^(pipeline/|data/|railway\.json$|\.env\.example$|\.github/workflows/railway\.yml$)'; then
              backend=true
            fi

            if [[ "${{ vars.RAILWAY_DEPLOY_BACKEND_WORKER || 'false' }}" == "true" ]] && echo "$changed_files" | grep -Eq '^(pipeline/|data/|railway\.json$|\.env\.example$|\.github/workflows/railway\.yml$)'; then
              backend_worker=true
            fi
          fi

          echo "frontend=$frontend" >> "$GITHUB_OUTPUT"
          echo "backend=$backend" >> "$GITHUB_OUTPUT"
          echo "backend_worker=$backend_worker" >> "$GITHUB_OUTPUT"

  deploy-frontend:
    name: Deploy frontend
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: self-hosted
    env:
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
      RAILWAY_PROJECT_ID: ${{ secrets.RAILWAY_PROJECT_ID }}
      RAILWAY_ENVIRONMENT: ${{ vars.RAILWAY_ENVIRONMENT || 'production' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Railway CLI
        shell: bash
        run: |
          set -euo pipefail
          railway_cli_dir="$RUNNER_TEMP/railway-cli"
          mkdir -p "$railway_cli_dir"
          npm install --prefix "$railway_cli_dir" @railway/cli
          railway_bin="$railway_cli_dir/node_modules/.bin/railway"
          echo "$(dirname "$railway_bin")" >> "$GITHUB_PATH"
          echo "RAILWAY_CLI=$railway_bin" >> "$GITHUB_ENV"
          "$railway_bin" --version

      - name: Deploy frontend to Railway
        shell: bash
        run: '"$RAILWAY_CLI" up --ci --service frontend --environment "$RAILWAY_ENVIRONMENT" --project "$RAILWAY_PROJECT_ID"'

  deploy-backend:
    name: Deploy backend
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: self-hosted
    env:
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
      RAILWAY_PROJECT_ID: ${{ secrets.RAILWAY_PROJECT_ID }}
      RAILWAY_ENVIRONMENT: ${{ vars.RAILWAY_ENVIRONMENT || 'production' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Railway CLI
        shell: bash
        run: |
          set -euo pipefail
          railway_cli_dir="$RUNNER_TEMP/railway-cli"
          mkdir -p "$railway_cli_dir"
          npm install --prefix "$railway_cli_dir" @railway/cli
          railway_bin="$railway_cli_dir/node_modules/.bin/railway"
          echo "$(dirname "$railway_bin")" >> "$GITHUB_PATH"
          echo "RAILWAY_CLI=$railway_bin" >> "$GITHUB_ENV"
          "$railway_bin" --version

      - name: Deploy backend to Railway
        shell: bash
        run: '"$RAILWAY_CLI" up --ci --service backend --environment "$RAILWAY_ENVIRONMENT" --project "$RAILWAY_PROJECT_ID"'

  deploy-backend-worker:
    name: Deploy backend worker
    needs: changes
    if: needs.changes.outputs.backend_worker == 'true'
    runs-on: self-hosted
    env:
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
      RAILWAY_PROJECT_ID: ${{ secrets.RAILWAY_PROJECT_ID }}
      RAILWAY_ENVIRONMENT: ${{ vars.RAILWAY_ENVIRONMENT || 'production' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Railway CLI
        shell: bash
        run: |
          set -euo pipefail
          railway_cli_dir="$RUNNER_TEMP/railway-cli"
          mkdir -p "$railway_cli_dir"
          npm install --prefix "$railway_cli_dir" @railway/cli
          railway_bin="$railway_cli_dir/node_modules/.bin/railway"
          echo "$(dirname "$railway_bin")" >> "$GITHUB_PATH"
          echo "RAILWAY_CLI=$railway_bin" >> "$GITHUB_ENV"
          "$railway_bin" --version

      - name: Deploy backend worker to Railway
        shell: bash
        run: '"$RAILWAY_CLI" up --ci --service backend-worker --environment "$RAILWAY_ENVIRONMENT" --project "$RAILWAY_PROJECT_ID"'
