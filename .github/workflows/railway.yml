          mkdir -p "$railway_cli_dir"
          npm install --prefix "$railway_cli_dir" @railway/cli
          railway_bin="$railway_cli_dir/node_modules/.bin/railway"
          echo "$(dirname "$railway_bin")" >> "$GITHUB_PATH"
          echo "RAILWAY_CLI=$railway_bin" >> "$GITHUB_ENV"
          "$railway_bin" --version

      - name: Deploy ingest worker to Railway
        shell: bash
        run: '"$RAILWAY_CLI" up --ci --service ingest-worker --environment "$RAILWAY_ENVIRONMENT" --project "$RAILWAY_PROJECT_ID"'

  deploy-ml-worker:
    name: Deploy ML worker
    needs: changes
    if: needs.changes.outputs.ml_worker == 'true'
    runs-on: self-hosted
    timeout-minutes: 30
    env:
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
      RAILWAY_PROJECT_ID: ${{ secrets.RAILWAY_PROJECT_ID }}
      RAILWAY_ENVIRONMENT: ${{ vars.RAILWAY_ENVIRONMENT || 'production' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Railway CLI
        shell: bash
        run: |
          set -euo pipefail
          railway_cli_dir="$RUNNER_TEMP/railway-cli"
          mkdir -p "$railway_cli_dir"
          npm install --prefix "$railway_cli_dir" @railway/cli
          railway_bin="$railway_cli_dir/node_modules/.bin/railway"
          echo "$(dirname "$railway_bin")" >> "$GITHUB_PATH"
          echo "RAILWAY_CLI=$railway_bin" >> "$GITHUB_ENV"
          "$railway_bin" --version

      - name: Deploy ML worker to Railway
        shell: bash
        run: '"$RAILWAY_CLI" up --ci --service ml-worker --environment "$RAILWAY_ENVIRONMENT" --project "$RAILWAY_PROJECT_ID"'

  deploy-agent-worker:
    name: Deploy agent worker
    needs: changes
    if: needs.changes.outputs.agent_worker == 'true'
    runs-on: self-hosted
    timeout-minutes: 30
    env:
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
      RAILWAY_PROJECT_ID: ${{ secrets.RAILWAY_PROJECT_ID }}
      RAILWAY_ENVIRONMENT: ${{ vars.RAILWAY_ENVIRONMENT || 'production' }}
    steps:
