name: Lint and Test

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: self-hosted
    env:
      PYTHONPATH: pipeline
      PYTHONUTF8: 1

    steps:
    - uses: actions/checkout@v6

    - name: Set up Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: "3.10"
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r pipeline/requirements.txt
        pip install flake8 pytest pytest-asyncio pytest-cov

    - name: Lint with flake8
      run: |
        # Dừng build nếu có lỗi syntax error
        python -m flake8 pipeline --count --select=E9,F63,F7,F82 --show-source --statistics
        # Báo cáo các lỗi khác dưới dạng warning
        python -m flake8 pipeline --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

    - name: Run Unit Tests
      run: |
        python -m pytest pipeline/tests -q
