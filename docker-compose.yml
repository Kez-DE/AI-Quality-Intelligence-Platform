# docker-compose.yml — local testing only
# Railway deploys each service from its own Dockerfile, not from this file.
services:
  backend:
    build:
      context: .
      dockerfile: pipeline/Dockerfile
    ports:
      - "8000:8000"
    env_file: .env
    environment:
      - PORT=8000
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  frontend:
    build:
      context: .
      dockerfile: app/Dockerfile
    ports:
      - "3000:3000"
    env_file: .env
    environment:
      - PORT=3000
      - NITRO_PORT=3000
      - NITRO_HOST=0.0.0.0
      - BACKEND_API_URL=http://backend:8000
      # Browser code runs on the host, so it must call the published backend port.
      - VITE_BACKEND_API_URL=http://localhost:8000
      - VITE_CUSTOMER_WEB_URL=http://localhost:5175
    depends_on:
      backend:
        condition: service_healthy
